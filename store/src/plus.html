<html><head><style>
@font-face{font-family:Outfit;src:url(outfit.ttf)} @font-face{font-family:Figtree;src:url(figtree.ttf)}
body{margin:0;width:1080px;height:2160px;overflow:hidden;background:linear-gradient(180deg,#2C205E 0%,#5B3470 55%,#A8476F 85%,#D9775F 100%);font-family:Figtree,sans-serif;color:#FFE9C7}
.head{padding:150px 90px 0}
.pill{display:inline-block;font:600 28px/1 Figtree;letter-spacing:3px;text-transform:uppercase;padding:14px 22px;border-radius:999px;background:rgba(255,225,176,.16);border:2px solid rgba(255,225,176,.45)}
h1{font:600 84px/1.05 Outfit;margin:30px 0 0;letter-spacing:-1px}
p{font:500 34px/1.35 Figtree;margin:18px 0 0;color:#FFE1B0;opacity:.9}
.cards{position:absolute;left:0;right:0;top:760px;display:grid;gap:36px;justify-items:center}.r{display:flex;gap:36px}
.c{border-radius:24px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(20,10,30,.35)}
.c img{position:absolute;width:1080px;height:2160px;transform-origin:0 0}
.lab{position:absolute;left:24px;bottom:20px;font:600 30px/1 Outfit;background:rgba(30,20,45,.65);padding:12px 20px;border-radius:999px}
</style></head><body>
<div class="head"><span class="pill">First Light Plus</span><h1>Three more puzzles</h1><p>Sneak peek. One payment, no subscription.</p></div>
<div class="cards"><div class="r"><div class="c" style="width:475px;height:505px;background:url(path.png) -32.5px -386.0px/540.0px 1080.0px no-repeat"><span class="lab">Path</span></div><div class="c" style="width:475px;height:505px;background:url(slide.png) -32.5px -386.0px/540.0px 1080.0px no-repeat"><span class="lab">Slide out</span></div></div><div class="r"><div class="c" style="width:475px;height:452px;background:url(pairs.png) -32.5px -412.0px/540.0px 1080.0px no-repeat"><span class="lab">Pairs</span></div></div></div></body></html>
